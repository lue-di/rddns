name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if HEAD already tagged
        id: check_tag
        run: |
          TAG=$(git tag --points-at HEAD 2>/dev/null | head -1)
          if [ -n "$TAG" ]; then
            echo "HEAD already has tag $TAG, skipping version bump"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "existing_tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version from latest tag
        if: steps.check_tag.outputs.skip != 'true'
        id: version
        run: |
          # Get the latest tag, default to v0.0.0 if none
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Strip v prefix and bump
          LATEST_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VER"

          BUMP="${{ steps.plan.outputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            NEW_VER="$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "minor" ]; then
            NEW_VER="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.check_tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check_tag.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.new_version }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/rddns:latest
            ${{ secrets.DOCKERHUB_USER }}/rddns:v${{ steps.version.outputs.new_version }}
